name: checks

# Runs on every pull request, and on main after a merge. Not on plain branch pushes: that would
# run twice for any branch with an open pull request.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request replaces its old run. Runs on main always finish, so no merge
# goes unchecked.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Every commit, because the secret scan below reads the whole history.
          fetch-depth: 0
          persist-credentials: false

      # A key that was committed and later deleted is still in the history, and still burned.
      # A pinned release, verified against its published checksum before it runs.
      - name: Scan the history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          (
            set -eo pipefail
            cd "$RUNNER_TEMP"
            base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
            tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            curl --retry 3 --retry-all-errors -sSfLO "$base/$tarball"
            curl --retry 3 --retry-all-errors -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
            grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
            tar -xzf "$tarball" gitleaks
            # A config that doesn't extend gitleaks' own rules replaces them with none.
            if [ -f "$GITHUB_WORKSPACE/.gitleaks.toml" ] \
               && ! grep -Eq '^[[:space:]]*useDefault[[:space:]]*=[[:space:]]*true' "$GITHUB_WORKSPACE/.gitleaks.toml"; then
              echo "::error::.gitleaks.toml does not extend gitleaks' own rules ([extend] useDefault = true)."
              exit 1
            fi
            # The history of the commit being checked, merge commits included.
            ./gitleaks git --redact --no-banner --no-color --exit-code 3 \
              --log-opts="--full-history --diff-merges=first-parent HEAD" "$GITHUB_WORKSPACE" 2>&1 | tee gitleaks.log
            # gitleaks exits 0 when the git command under it fails, having scanned nothing.
            if grep -Eq '(^|[^0-9])0 commits scanned|(^| )ERR( |$)' gitleaks.log; then
              echo "::error::gitleaks read no history, so nothing was scanned."
              exit 1
            fi
          ) 2>&1 | tee "$RUNNER_TEMP/logs/gitleaks.log"

      - name: Check the design documents
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          python3 scripts/check_design.py 2>&1 | tee "$RUNNER_TEMP/logs/design-check.log"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Install (frozen lockfile)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          corepack enable
          pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/logs/install.log"

      - name: Lint and type-check
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee "$RUNNER_TEMP/logs/lint.log"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee "$RUNNER_TEMP/logs/test.log"

      - name: Cache Cargo
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Record Cargo cache result
        if: always() && steps.cargo-cache.outcome != 'skipped'
        shell: bash
        env:
          CACHE_OUTCOME: ${{ steps.cargo-cache.outcome }}
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          (
            set -eo pipefail
            printf 'Cargo cache outcome: %s\nCache hit: %s\n' "$CACHE_OUTCOME" "${CACHE_HIT:-false}"
          ) 2>&1 | tee "$RUNNER_TEMP/logs/cache-cargo.log"

      - name: Install Solana and Anchor
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          (
            set -eo pipefail
            cd "$RUNNER_TEMP"
            solana_archive=solana-release-x86_64-unknown-linux-gnu.tar.bz2
            curl --retry 3 --retry-all-errors -sSfLO "https://github.com/anza-xyz/agave/releases/download/v3.1.10/$solana_archive"
            printf '%s  %s\n' a7205ff29bcf0f7199740225ecae2b85a28ea9668892d5ec21bd9749882984a1 "$solana_archive" | sha256sum --check --strict -
            tar -xjf "$solana_archive"
            printf '%s\n' "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"

            anchor_binary=anchor-1.2.2-x86_64-unknown-linux-gnu
            curl --retry 3 --retry-all-errors -sSfLO "https://github.com/solana-foundation/anchor/releases/download/v1.2.2/$anchor_binary"
            printf '%s  %s\n' e2c35a973bcfe476f3a89b120e99820f917229faf33d3e71f6625bd94199e741 "$anchor_binary" | sha256sum --check --strict -
            install -Dm755 "$anchor_binary" "$RUNNER_TEMP/anchor-bin/anchor"
            printf '%s\n' "$RUNNER_TEMP/anchor-bin" >> "$GITHUB_PATH"
          ) 2>&1 | tee "$RUNNER_TEMP/logs/install-solana-and-anchor.log"

      - name: Rust format and lint
        shell: bash
        run: |
          set -o pipefail
          (
            set -eo pipefail
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets -- -D warnings
          ) 2>&1 | tee "$RUNNER_TEMP/logs/rust-format-and-lint.log"

      - name: Build program
        shell: bash
        run: |
          set -o pipefail
          (
            set -eo pipefail
            anchor build
          ) 2>&1 | tee "$RUNNER_TEMP/logs/build-program.log"

      - name: Program tests
        shell: bash
        run: |
          set -o pipefail
          (
            set -eo pipefail
            cargo test --workspace
          ) 2>&1 | tee "$RUNNER_TEMP/logs/program-tests.log"

      - name: Install Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13  # v3.2.0
        with:
          version: 2.122.1

      - name: Start Supabase
        shell: bash
        run: |
          set -o pipefail
          (
            set -eo pipefail
            supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,postgres-meta,supavisor
          ) 2>&1 | tee "$RUNNER_TEMP/logs/start-supabase.log"

      - name: Database tests
        shell: bash
        run: |
          set -o pipefail
          (
            set -eo pipefail
            supabase db reset
            supabase test db
          ) 2>&1 | tee "$RUNNER_TEMP/logs/database-tests.log"

      - name: Scan dependencies for known vulnerabilities
        shell: bash
        env:
          OSV_SCANNER_VERSION: 2.5.1
        run: |
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          (
            cd "$RUNNER_TEMP"
            base="https://github.com/google/osv-scanner/releases/download/v$OSV_SCANNER_VERSION"
            binary="osv-scanner_linux_amd64"
            curl --retry 3 --retry-all-errors -sSfLO "$base/$binary"
            curl --retry 3 --retry-all-errors -sSfLO "$base/osv-scanner_SHA256SUMS"
            grep -E "[[:space:]][*]?${binary}$" osv-scanner_SHA256SUMS | sha256sum --check --strict -
            chmod +x "$binary"
            cd "$GITHUB_WORKSPACE"
            "$RUNNER_TEMP/$binary" scan source --config osv-scanner.toml --no-resolve -L pnpm-lock.yaml -L Cargo.lock
          ) 2>&1 | tee "$RUNNER_TEMP/logs/osv-scanner.log"

      - name: Check for duplicated code
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          (
            shopt -s lastpipe
            git ls-files -z | mapfile -d '' -t tracked_files
            files=()
            for file in "${tracked_files[@]}"; do
              case "/$file" in
                */docs/*|*/legacy/*|*/fixtures/*|*/mocks/*|*/__mocks__/*|*/testdata/*|*/node_modules/*|*/vendor/*|*/dist/*|*/build/*|*/test/*|*/tests/*|*/__tests__/*|*/components/ui/*)
                  continue ;;
              esac
              case "${file##*/}" in
                *.d.ts|*.test.*|*.spec.*|test_*.py|*_test.py|*_test.go)
                  continue ;;
                *.py|*.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.go|*.rs|*.java|*.rb|*.php|*.c|*.cc|*.cpp|*.h|*.hpp|*.cs|*.kt|*.swift)
                  files+=("./$file") ;;
              esac
            done
            if (( ${#files[@]} == 0 )); then
              echo "No source files to compare"
            else
              npx --yes jscpd@5.2.0 --threshold 5 --reporters console --no-colors "${files[@]}"
            fi
          ) 2>&1 | tee "$RUNNER_TEMP/logs/jscpd.log"

      # Every run keeps its step logs as an artifact, pass or fail, for the longest retention
      # GitHub allows (90 days), so a failure can be read without re-running it. A new step
      # writes its output to $RUNNER_TEMP/logs/<step>.log to be kept with them.
      - name: Keep this run's logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: checks-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logs/
          if-no-files-found: warn
          retention-days: 90
