[package]
name = "signing-spike"
version = "0.1.0"
description = "D32 spike: two Programmatic Signer authorities authorise one instruction"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "signing_spike"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.2"

[dev-dependencies]
# Cargo.lock pins LiteSVM's Rust-1.89-compatible dependency graph.
litesvm = "0.15.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"
solana-signature = "3"
solana-hash = "4"
solana-clock = "3"
sha2 = "0.10"
# Programmatic Signer interfaces (solana-program/ed25519-programmatic-signer, devnet programs).
spl-ed25519-signer-interface = "=1.0.0"
spl-message-executor-interface = "=1.0.0"
spl-nonce-interface = "=1.0.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
