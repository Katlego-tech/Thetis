[package]
name = "thetis"
version = "0.1.0"
description = "Thetis custody and receipt program"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "thetis"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.2", features = ["token_2022", "associated_token"] }
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"
solana-sha256-hasher = "3.1.0"

[dev-dependencies]
litesvm = { version = "0.15.0", features = ["precompiles"] }
serde_json = "1.0.151"
solana-clock = "3"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
